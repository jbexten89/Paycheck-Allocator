<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="T" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F3A"/><stop offset="0.45" stop-color="#171A22"/><stop offset="1" stop-color="#0B0D12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#T)"/>
  <!-- reference lines sit behind the bars, as on the dashboard chart -->
  <!-- paycheck value: dashed ceiling, uninterrupted so the dashes read -->
  <line x1="72" y1="120" x2="440" y2="120" stroke="#FFFFFF" stroke-width="14" stroke-dasharray="40 26"/>
  <!-- average set-aside: solid, since the bars already break it into segments -->
  <line x1="72" y1="228" x2="440" y2="228" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
  <rect x="96"  y="264" width="60" height="108" rx="14" fill="#3B82F6"/>
  <rect x="176" y="216" width="60" height="156" rx="14" fill="#3B82F6"/>
  <rect x="256" y="240" width="60" height="132" rx="14" fill="#3B82F6"/>
  <rect x="336" y="176" width="60" height="196" rx="14" fill="#22C55E"/>
</svg>
