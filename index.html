<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    /* Light mode (kept understated; dark is the primary look) */
    --paper: #FFFFFF;
    --paper-2: #F4F6FA;
    --ink: #0F1419;
    --ink-soft: #3F4754;
    --ink-muted: #6B7480;
    --hairline: #E5E8EE;
    --hairline-strong: #D2D7E0;
    --amber: #3B82F6;        /* "amber" var name retained — now the blue accent */
    --amber-soft: #60A5FA;
    --good: #16A34A;
    --danger: #EF4444;
    --shadow: 0 1px 2px rgba(15,20,25,0.04), 0 8px 24px rgba(15,20,25,0.06);
    --radius: 10px;
    --radius-lg: 14px;
    --gap: 16px;
    --serif: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'Menlo', monospace;
  }
  html[data-theme="dark"] {
    --paper: #0E1014;        /* app background */
    --paper-2: #161A22;      /* card / sidebar surface */
    --ink: #F3F5F9;
    --ink-soft: #C7CDD8;
    --ink-muted: #8A93A2;
    --hairline: #232934;
    --hairline-strong: #2F3743;
    --amber: #3B82F6;        /* primary blue accent */
    --amber-soft: #60A5FA;
    --good: #22C55E;         /* money green */
    --danger: #F87171;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.5);
  }
  @media (prefers-color-scheme: dark) {
    html[data-theme="auto"] {
      --paper: #0E1014;
      --paper-2: #161A22;
      --ink: #F3F5F9;
      --ink-soft: #C7CDD8;
      --ink-muted: #8A93A2;
      --hairline: #232934;
      --hairline-strong: #2F3743;
      --amber: #3B82F6;
      --amber-soft: #60A5FA;
      --good: #22C55E;
      --danger: #F87171;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.5);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; overscroll-behavior: none; color-scheme: dark; }
  body { overflow-x: clip; }
  body {
    font-family: var(--sans);
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.5;
  }
  .num, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  h1, h2, h3, .serif { font-family: var(--sans); font-weight: 600; letter-spacing: -0.01em; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 14px; font-weight: 600; }
  h2.accent {
    color: var(--amber);
    text-transform: uppercase;
    font-size: 12px;
    letter-spacing: 0.1em;
    font-weight: 700;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 12px;
  }
  h3 { font-size: 15px; margin: 0 0 8px; }
  a { color: var(--amber); text-decoration: none; }
  button { font-family: var(--sans); cursor: pointer; }
  input, select, textarea { font-family: var(--sans); color: var(--ink); }
  input[type="checkbox"] {
    width: 22px !important;
    height: 22px !important;
    accent-color: var(--amber);
    cursor: pointer;
    flex-shrink: 0;
    margin: 0;
  }
  input[type="number"], input[type="text"], input[type="email"], input[type="password"], input[type="search"], input[type="tel"], input[type="url"], input[type="date"], input:not([type]), select, textarea {
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 15px;
    width: 100%;
    min-width: 0;
    max-width: 100%;
    color: var(--ink);
    -webkit-text-fill-color: var(--ink);
  }
  input[type="date"] { -webkit-appearance: none; appearance: none; }
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  /* Kill the light autofill background WebKit paints on filled inputs.
     The background-clip: text trick clips WebKit's autofill background to just
     the text glyphs, letting the real input background show through — this is
     the only reliable fix on iOS Safari where box-shadow inset doesn't stick. */
  input { color-scheme: dark; }
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus,
  input:-webkit-autofill:active,
  input:autofill {
    -webkit-background-clip: text !important;
    background-clip: text !important;
    -webkit-text-fill-color: var(--ink) !important;
    -webkit-box-shadow: 0 0 0 100px var(--paper) inset !important;
    box-shadow: 0 0 0 100px var(--paper) inset !important;
    caret-color: var(--ink) !important;
    transition: background-color 9999s ease-in-out 0s;
  }
  input:focus, select:focus { outline: 2px solid var(--amber); outline-offset: 1px; border-color: var(--amber); }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-muted); margin-bottom: 5px; font-weight: 500; }

  /* Layout */
  .app {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: 100vh;
  }
  .sidebar {
    border-right: 1px solid var(--hairline);
    padding: 24px 14px;
    background: var(--paper);
    position: sticky; top: 0; align-self: start;
    height: 100vh;
  }
  .brand { font-family: var(--sans); font-size: 18px; font-weight: 700; line-height: 1.15; padding: 0 8px; }
  .brand small { display: block; font-family: var(--sans); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-muted); margin-top: 6px; font-weight: 500; }
  .nav { margin-top: 24px; display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    color: var(--ink-soft);
    font-size: 14px; font-weight: 500;
  }
  .nav a:hover { background: var(--paper-2); color: var(--ink); }
  .nav a.active { background: var(--paper-2); color: var(--amber); }
  .nav .ico { font-family: var(--sans); font-style: normal; color: currentColor; width: 16px; text-align: center; opacity: 0.85; }

  main {
    padding: 32px 40px 100px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    min-width: 0;
  }
  .view-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 24px; padding-bottom: 16px; }
  .view-header .sub { color: var(--ink-muted); font-size: 13px; }

  .view { animation: fade 200ms ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* Cards */
  .card {
    background: var(--paper-2);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
  }
  .grid { display: grid; gap: var(--gap); }
  .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (max-width: 900px) {
    .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 768px) {
    .grid-2 { grid-template-columns: 1fr; }
  }
  .card { min-width: 0; }
  .summary .value { overflow-wrap: anywhere; }

  .summary .card { padding: 14px 18px; }
  .summary-top, .summary-bot {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--gap);
  }
  .summary-top { margin-bottom: var(--gap); }
  /* On mobile the wrapper is invisible to layout so summary-bot's sticky
     containing block extends through the breakdown card below. */
  .summary-row { display: contents; }
  /* On desktop the wrapper becomes a flex row so both 2-col groups sit
     side-by-side (4 cards in one row) and sticks to the top when scrolling. */
  @media (min-width: 900px) {
    .summary-row {
      display: flex;
      gap: var(--gap);
      margin: 0 -8px var(--gap);
      padding: 8px;
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--paper);
      box-shadow: 0 6px 12px rgba(0,0,0,0.35);
    }
    .summary-top, .summary-bot { flex: 1; margin: 0 !important; }
    .summary-bot { position: static !important; box-shadow: none !important; padding: 0 !important; background: transparent !important; }
  }
  @media (max-width: 768px) {
    .summary-bot {
      position: sticky;
      top: env(safe-area-inset-top, 0px);
      z-index: 30;
      padding: 8px 16px;
      background: var(--paper);
      box-shadow: 0 6px 12px rgba(0,0,0,0.35);
      margin: 0 -16px 12px;
    }
    /* Opaque strip covering the safe-area region at the very top of the viewport
       so scrolling content doesn't show through into the notch/status-bar area. */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: env(safe-area-inset-top, 0px);
      background: var(--paper);
      z-index: 40;
      pointer-events: none;
    }
  }
  .summary .label { font-size: 12px; color: var(--amber); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
  .summary .value { font-family: var(--sans); font-variant-numeric: tabular-nums; font-size: 20px; font-weight: 700; color: var(--good); margin-top: 4px; letter-spacing: -0.01em; line-height: 1.2; }
  .summary .value.neutral { color: var(--ink); }
  .summary .value.amber { color: var(--amber); }
  .summary .hint { font-size: 11px; color: var(--ink-muted); margin-top: 10px; line-height: 1.25; }
  .setaside-bar {
    margin-top: 8px;
    height: 6px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    overflow: hidden;
  }
  .setaside-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--amber-soft), var(--amber));
    border-radius: 999px;
    transition: width 240ms ease;
  }
  .setaside-bar-fill.over { background: var(--danger); }
  .leftover-amount { font-size: 16px; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
  .leftover-amount.short { color: var(--danger); }
  .cell-credit-input {
    display: inline-block !important;
    width: 70px !important;
    padding: 2px 6px !important;
    font-size: 11px !important;
    height: 22px;
    margin-left: 6px;
    vertical-align: middle;
  }
  .pay-nav { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: nowrap; }
  .next-pay-card { position: relative; padding-bottom: 28px; }
  .next-pay-card .pay-after {
    position: absolute;
    right: 12px;
    bottom: 6px;
    font-size: 10px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .pay-arrow {
    background: transparent; border: 1px solid var(--hairline);
    color: var(--ink); width: 36px; height: 36px;
    border-radius: 8px; font-size: 20px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer; flex-shrink: 0;
  }
  .pay-arrow:hover:not([disabled]) { border-color: var(--amber); color: var(--amber); }
  .pay-arrow[disabled] { opacity: 0.3; cursor: not-allowed; }
  .today-chip { padding: 6px 14px !important; font-size: 14px !important; height: 32px; }
  @media (max-width: 768px) {
    .today-chip { padding: 3px 10px !important; font-size: 12px !important; height: 24px; }
  }

  /* Buttons */
  .btn {
    appearance: none; border: 1px solid var(--hairline-strong);
    background: var(--paper-2);
    color: var(--ink); padding: 8px 14px;
    border-radius: 999px; font-size: 13px; font-weight: 500;
    transition: all 150ms;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--amber); color: var(--amber); }
  .btn-primary { background: var(--amber); color: #fff; border-color: var(--amber); }
  .btn-primary:hover { background: var(--amber-soft); border-color: var(--amber-soft); color: #fff; }
  .btn-danger { color: var(--danger); border-color: var(--hairline-strong); }
  .btn-danger:hover { background: var(--danger); color: #fff; border-color: var(--danger); }
  .btn-ghost { background: transparent; border-color: transparent; }
  .btn-ghost:hover { background: var(--paper-2); color: var(--ink); border-color: transparent; }

  /* Bills */
  .bill-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 12px;
    align-items: center;
    padding: 5px 12px;
    border-bottom: 1px solid var(--hairline);
    background: var(--paper-2);
    cursor: pointer;
    transition: background 150ms;
    min-height: 30px;
  }
  .bill-row:hover { background: var(--paper); }
  .bill-row:last-child { border-bottom: none; }
  .bill-row { touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .cat-header { touch-action: pan-y; }
  .drag-handle { touch-action: none; cursor: grab; color: var(--ink-muted); opacity: 0.5; letter-spacing: -3px; padding: 4px 6px; user-select: none; }
  .drag-handle:hover { opacity: 1; color: var(--amber); }
  body.drag-lock { touch-action: none !important; overflow: hidden !important; }
  body.drag-lock * { touch-action: none !important; }
  .bill-row.reorder-source { opacity: 0.3; }
  .bill-row.bill-archived .bill-name,
  .bill-row.bill-archived .bill-amount { opacity: 0.5; text-decoration: line-through; }
  .bill-row.drag-over-top { box-shadow: inset 0 2px 0 var(--amber); }
  .bill-row.drag-over-bottom { box-shadow: inset 0 -2px 0 var(--amber); }
  .reorder-ghost { border-radius: var(--radius-lg); overflow: hidden; }
  .bill-list { border: 1px solid var(--hairline); border-radius: var(--radius-lg); overflow: hidden; background: var(--paper-2); }
  .bill-color { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
  .bill-name { font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--ink); line-height: 1.2; display: inline; }
  .bill-meta { font-size: 11px; color: var(--ink-muted); margin-left: 8px; line-height: 1.2; display: inline; }
  .bill-amount { font-family: var(--sans); font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--good); }
  .badge { display: inline-block; padding: 0 6px; border-radius: 99px; font-size: 10px; background: var(--paper); border: 1px solid var(--hairline); color: var(--ink-muted); margin-left: 6px; }
  .delete-btn { padding: 2px 8px !important; font-size: 12px !important; }
  .cat-group { margin-bottom: 18px; }
  .cat-group:last-child { margin-bottom: 0; }
  .cat-header {
    display: flex; align-items: baseline; justify-content: flex-start; gap: 10px;
    padding: 8px 12px;
    background: var(--paper);
    border: 1px solid var(--hairline);
    border-bottom: none;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    margin-bottom: 0;
    position: relative;
    user-select: none;
    cursor: pointer;
  }
  .cat-group.collapsed .cat-header {
    border-bottom: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
  }
  .cat-group.collapsed .bill-list { display: none; }
  .cat-spacer { flex: 1; }
  .cat-delete {
    background: transparent; border: none;
    color: var(--ink-muted); font-size: 14px; line-height: 1;
    padding: 4px 6px; border-radius: 6px; cursor: pointer;
    transition: color 120ms, background 120ms;
  }
  .cat-delete:hover { color: var(--danger); background: rgba(248,113,113,0.1); }
  .cat-chevron {
    display: inline-block;
    color: var(--ink-muted);
    font-size: 11px;
    width: 12px;
    text-align: center;
    line-height: 1;
    transition: transform 120ms;
  }
  .cat-group .bill-list {
    border-top-left-radius: 0;
    border-top-right-radius: 0;
  }
  .cat-header { touch-action: pan-y; }
  .cat-header:hover { border-color: var(--hairline-strong); }
  .cat-header.reorder-source { opacity: 0.3; }
  .cat-header.drag-over-top { box-shadow: inset 0 3px 0 var(--amber); }
  .cat-header.drag-over-bottom { box-shadow: inset 0 -3px 0 var(--amber); }
  .cat-name {
    font-family: var(--sans); font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--amber);
  }
  .cat-meta {
    font-family: var(--sans); font-size: 11px;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .cat-controls { display: inline-flex; align-items: center; gap: 6px; }
  .cat-move {
    background: transparent; border: 1px solid var(--hairline);
    color: var(--ink-muted); width: 22px; height: 22px;
    border-radius: 6px; font-size: 10px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer; transition: all 120ms;
  }
  .cat-move:hover:not([disabled]) { color: var(--amber); border-color: var(--amber); }
  .cat-move[disabled] { opacity: 0.3; cursor: not-allowed; }
  .bill-move-group { display: inline-flex; gap: 2px; opacity: 0; transition: opacity 120ms; }
  .bill-row:hover .bill-move-group,
  .bill-row:focus-within .bill-move-group { opacity: 1; }
  .bill-move {
    background: transparent; border: 1px solid var(--hairline);
    color: var(--ink-muted); width: 18px; height: 18px;
    border-radius: 4px; font-size: 9px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; cursor: pointer; transition: all 120ms;
  }
  .bill-move:hover:not([disabled]) { color: var(--amber); border-color: var(--amber); }
  .bill-move[disabled] { opacity: 0.3; cursor: not-allowed; }
  @media (max-width: 768px) {
    .bill-move-group { opacity: 1; }
  }
  .delete-btn { color: var(--danger); background: transparent; border: none; padding: 6px 10px; font-size: 13px; opacity: 0; transition: opacity 150ms; }
  .bill-row:hover .delete-btn { opacity: 1; }

  /* Schedule table */
  .schedule-wrap { overflow: auto; max-height: calc(100dvh - 240px); border: 1px solid var(--hairline); border-radius: var(--radius-lg); background: var(--paper-2); overscroll-behavior: contain; }
  @media (max-width: 768px) { .schedule-wrap { max-height: calc(100dvh - 200px); } }
  table.schedule { border-collapse: separate; border-spacing: 0; width: 100%; }
  .schedule-wrap table.schedule { width: auto; min-width: 100%; }
  .schedule-wrap table.schedule th:not(:first-child):not(:last-child),
  .schedule-wrap table.schedule td:not(:first-child):not(:last-child) { min-width: 88px; }
  .schedule-wrap table.schedule th:last-child,
  .schedule-wrap table.schedule td:last-child { min-width: 96px; }
  table.schedule th, table.schedule td { padding: 3px 6px; border-bottom: 1px solid var(--hairline); text-align: right; font-family: var(--sans); font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; height: 26px; line-height: 1.15; background: var(--paper-2); }
  table.schedule th:first-child, table.schedule td:first-child { padding-left: 12px; }
  table.schedule th:last-child, table.schedule td:last-child { padding-right: 12px; }
  /* sticky column + header only for the full pay-schedule view */
  .schedule-wrap table.schedule th:first-child,
  .schedule-wrap table.schedule td:first-child {
    min-width: 160px;
    position: sticky; left: 0; z-index: 20;
    background: var(--paper-2) !important;
    box-shadow: 1px 0 0 var(--hairline);
  }
  .schedule-wrap table.schedule thead th { position: sticky; top: 0; z-index: 10; background: var(--paper-2); }
  .schedule-wrap table.schedule thead th:first-child { z-index: 30; }
  .schedule-wrap table.schedule tr.sched-cat-header td:first-child { z-index: 20; background: var(--paper) !important; }

const fmtUSD = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
const fmtDate = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const fmtDateShort = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric' });
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

/* ------------------------- Date helpers ------------------------- */
function parseISO(s) {
  // "YYYY-MM-DD" -> local Date at midnight
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function addDays(d, n) {
  const r = new Date(d);
  r.setDate(r.getDate() + n);
  return r;
}
function daysInMonth(year, monthIdx) {
  return new Date(year, monthIdx + 1, 0).getDate();
}
function dueDateInMonth(year, monthIdx, dueDay) {
  const dim = daysInMonth(year, monthIdx);
  return new Date(year, monthIdx, Math.min(dueDay, dim));
}
function isSameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
function generatePayDates(startDate, count, frequency = 'biweekly') {
  const step = { biweekly: 14, weekly: 7 }[frequency] || 14;
  const dates = [];
  if (frequency === 'semi-monthly') {
    // 1st and 15th each month, starting from startDate's month
    let y = startDate.getFullYear(), m = startDate.getMonth();
    while (dates.length < count) {
      const d1 = new Date(y, m, 1), d15 = new Date(y, m, 15);
      [d1, d15].forEach((d) => { if (dates.length < count && d >= startDate) dates.push(d); });
      m++; if (m > 11) { m = 0; y++; }
    }
    return dates;
  }
  if (frequency === 'monthly') {
    for (let i = 0; i < count; i++) {
      const d = new Date(startDate);
      d.setMonth(d.getMonth() + i);
      dates.push(d);
    }
    return dates;
  }
  for (let i = 0; i < count; i++) dates.push(addDays(startDate, i * step));
  return dates;
}

/* ------------------------- Due-cycle helper ------------------------- */
/**
 * Given a bill and a pay date P, return the next due date D strictly after P
 * and the previous due date (one cycle earlier). Handles:
 *   - Monthly (default): uses bill.dueDay, clamped to month length.
 *   - Every N weeks: uses bill.dueAnchor (ISO) + bill.intervalWeeks.
 */
function nextDueCycleFor(bill, P) {
  const recurrence = bill.recurrence || 'monthly';
  if (recurrence === 'everyNWeeks') {
    const interval = Math.max(1, Number(bill.intervalWeeks) || 1);
    const anchor = bill.dueAnchor ? parseISO(bill.dueAnchor) : new Date(P);
    const stepMs = interval * 7 * 86400000;
    const diff = P - anchor;
    let k = Math.ceil(diff / stepMs);
    let D = new Date(anchor.getTime() + k * stepMs);
    if (D <= P) { k++; D = new Date(anchor.getTime() + k * stepMs); }
    const prevDue = new Date(anchor.getTime() + (k - 1) * stepMs);
    return { D, prevDue };
  }
  if (recurrence === 'everyNMonths') {
    const interval = Math.max(1, Number(bill.intervalMonths) || 1);
    const anchor = bill.dueAnchor ? parseISO(bill.dueAnchor) : new Date(P);
    const anchorDay = anchor.getDate();
    const monthsFromAnchor = (d) => (d.getFullYear() - anchor.getFullYear()) * 12 + (d.getMonth() - anchor.getMonth());
    // find smallest k such that anchor + k*interval months > P
    let k = Math.max(0, Math.ceil(monthsFromAnchor(P) / interval));
    const build = (kk) => {
      const y = anchor.getFullYear();
      const m = anchor.getMonth() + kk * interval;
      return dueDateInMonth(y, m, anchorDay);
    };
    let D = build(k);
    while (D <= P) { k++; D = build(k); }
    const prevDue = build(k - 1);
    return { D, prevDue };
  }
  // Monthly
  let candYear = P.getFullYear();
  let candMonth = P.getMonth();
  let D = dueDateInMonth(candYear, candMonth, bill.dueDay);
  while (D <= P) {
    candMonth++;
    if (candMonth > 11) { candMonth = 0; candYear++; }
    D = dueDateInMonth(candYear, candMonth, bill.dueDay);
  }
  let pYear = D.getFullYear();
  let pMonth = D.getMonth() - 1;
  if (pMonth < 0) { pMonth = 11; pYear--; }
  const prevDue = dueDateInMonth(pYear, pMonth, bill.dueDay);
  return { D, prevDue };
}

/* ------------------------- Allocation engine ------------------------- */
/**
 * computeAllocations(bills, payDates) -> {
 *   perPaycheck: [{ payDate, total, items: [{billId, name, amount, runningBalance, dueDate, paychecksInCycle}] }],
 *   byBill: { [billId]: [{ payDate, amount, runningBalance, dueDate, paychecksInCycle }] }
 * }
 *
 * Rules (per spec):
 *  - For each pay date P and bill: D = next due date strictly after P; prevDue = D minus one month.
 *    paychecksInCycle = pay dates strictly between prevDue and D.
 *    perPay = amount / count.
 *  - First cycle only: amount -= initialSaved before dividing (clamped >= 0).
 *  - A pay date on the due date does NOT count toward that month — money won't arrive in time.
 *  - Skip bills with amount <= 0.
 *  - Clamp due day to days-in-month.
 *  - Maintain running balance per bill, seeded with initialSaved, resets when due passes.
 */
// Calendar-day difference (b - a), ignoring time-of-day so DST doesn't skew.
function dayDiff(a, b) {
  const A = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
  const B = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
  return Math.round((B - A) / 86400000);
}
// Count pay dates falling in [prevDue, D) canonically from a payStart + step-days cadence.
function canonicalCycleCount(payStart, stepDays, prevDue, D) {
  const dPrev = dayDiff(payStart, prevDue);
  const dD = dayDiff(payStart, D);
  const nFirst = Math.ceil(dPrev / stepDays);
  // largest n such that n*stepDays < dD  (payStart + n*step < D, strictly)
  const q = dD / stepDays;
  const nLast = (q === Math.floor(q)) ? q - 1 : Math.floor(q);
  return Math.max(0, nLast - nFirst + 1);
}

// Replace per-cycle allocations with one lump sum on the first paycheck of each
// calendar month, equal to each bill's monthly-equivalent rate. Applied only
// to bills whose category is in `catSet` (lowercased Set of category names).
function batchMonthlyRateCats(perPaycheck, bills, catSet) {
  if (!perPaycheck.length || !catSet || !catSet.size) return perPaycheck;
  const targeted = bills.filter((b) => catSet.has((b.category || '').trim().toLowerCase()) && b.amount > 0 && !b.archived);
  if (!targeted.length) return perPaycheck;
  const monthlyRate = (b) => {
    if (b.recurrence === 'everyNMonths') return Number(b.amount) / Math.max(1, Number(b.intervalMonths) || 1);
    if (b.recurrence === 'everyNWeeks')  return Number(b.amount) * (52 / (Math.max(1, Number(b.intervalWeeks) || 1) * 12));
    return Number(b.amount); // monthly / day-of-month
  };
  const subIds = new Set(targeted.map((b) => b.id));
  // Strip every existing subscription item
  for (const p of perPaycheck) {
    let removed = 0;
    p.items = p.items.filter((it) => {
      if (subIds.has(it.billId)) { removed += it.amount; return false; }
      return true;
    });
    p.total -= removed;
  }
  // Deposit monthly-rate items on the first pay of each calendar month
  const firstByMonth = new Map();
  perPaycheck.forEach((p, i) => {
    const k = p.payDate.getFullYear() + '-' + p.payDate.getMonth();
    if (!firstByMonth.has(k)) firstByMonth.set(k, i);
  });
  for (const idx of firstByMonth.values()) {
    const p = perPaycheck[idx];
    for (const b of targeted) {
      const amt = monthlyRate(b);
      if (amt <= 0) continue;
      p.items.push({ billId: b.id, name: b.name, color: b.color, amount: amt, dueDate: p.payDate, paychecksInCycle: 1 });
      p.total += amt;
    }
  }
  return perPaycheck;
}

function computeAllocations(bills, payDates, opts = {}) {
  const canonPayStart = opts.payStart ? parseISO(opts.payStart) : (State && State.payStart ? parseISO(State.payStart) : null);
  const canonFreq = opts.frequency || (State && State.frequency);
  const canonStep = { weekly: 7, biweekly: 14, triweekly: 21 }[canonFreq];
  const perPaycheck = payDates.map((d) => ({ payDate: d, total: 0, items: [] }));
  const byBill = {};
  if (!payDates.length) return { perPaycheck, byBill };

  for (const bill of bills) {
    if (!bill || !(bill.amount > 0) || bill.archived) continue;
    byBill[bill.id] = [];
    let runningBalance = Number(bill.initialSaved || 0);
    let cycleIndex = 0;          // 0 = first cycle (uses initialSaved), 1+ subsequent
    let lastDueKey = null;       // used to detect crossing into a new cycle
    let payIdxInCycle = 0;       // 1-based position within current cycle

    // If the bill has an anchor-based recurrence and its anchor date is before the
    // first pay date in the schedule, treat that anchor's due as already resolved
    // (funded by initialSaved). Skip crediting initialSaved to the next cycle.
    if ((bill.recurrence === 'everyNMonths' || bill.recurrence === 'everyNWeeks') && bill.dueAnchor) {
      const anchor = parseISO(bill.dueAnchor);
      if (anchor <= payDates[0]) {
        cycleIndex = 1;
        runningBalance = 0;
      }
    }

    for (let i = 0; i < payDates.length; i++) {
      const P = payDates[i];
      const { D, prevDue } = nextDueCycleFor(bill, P);

      // Detect new cycle: if D differs from previously-tracked D, the previous due passed.
      const dueKey = toISO(D);
      if (lastDueKey !== dueKey) {
        if (lastDueKey !== null) { runningBalance = 0; cycleIndex++; }
        payIdxInCycle = 1;
      } else {
        payIdxInCycle++;
      }
      lastDueKey = dueKey;

      // Count pay dates that fund this cycle: [prevDue, D).
      // Anchor-based bills (everyNWeeks / everyNMonths) get canonical count so
      // long-interval cycles that predate payStart still divide correctly.
      // Day-of-month monthly bills use only paychecks in the visible schedule
      // — a partial "current cycle" should be funded by remaining paychecks only.
      const isAnchorBased = bill.recurrence === 'everyNMonths' || bill.recurrence === 'everyNWeeks';
      let cycleCount;
      if (canonStep && canonPayStart && isAnchorBased) {
        cycleCount = canonicalCycleCount(canonPayStart, canonStep, prevDue, D);
      } else {
        cycleCount = 0;
        for (const pd of payDates) if (pd >= prevDue && pd < D) cycleCount++;
      }
      if (cycleCount === 0) continue;

      // per-paycheck amount (with optional per-month credit for Cell bills)
      const cycleKey = D.getFullYear() + '-' + String(D.getMonth() + 1).padStart(2, '0');
      let cellCredit = 0;
      if (typeof State !== 'undefined' && State.cellCreditEnabled && (bill.name || '').trim().toLowerCase() === 'cell') {
        cellCredit = Math.max(0, Number((State.cellCredits || {})[cycleKey] || 0));
      }
      const effectiveAmount = Math.max(0, Number(bill.amount) - cellCredit);
      const baseAmount = cycleIndex === 0
        ? Math.max(0, effectiveAmount - Number(bill.initialSaved || 0))
        : effectiveAmount;
      // Detect if this iteration is the last visible pay in the current cycle
      const isLastVisibleInCycle = (i + 1 >= payDates.length)
        || (toISO(nextDueCycleFor(bill, payDates[i + 1]).D) !== dueKey);
      const cat = (bill.category || '').trim().toLowerCase();
      const shape = (typeof State !== 'undefined' && State.getCatShape) ? State.getCatShape(cat) : 'spread';
      let perPay;
      if (shape === 'monthly-rate') {
        // Handled by post-process; skip per-cycle allocation.
        perPay = 0;
      } else if (shape === 'single-cycle' && cycleCount > 1) {
        perPay = isLastVisibleInCycle ? baseAmount : 0;
      } else if (shape === 'first-two-of-three' && cycleCount === 3) {
        perPay = (payIdxInCycle === 3) ? 0 : baseAmount / 2;
      } else {
        // Spread evenly (default) — with optional global fallback for small monthly bills
        const singleSmall = shape === 'spread'
          && State.singleSmallMonthly
          && !isAnchorBased
          && Number(bill.amount) < Number(State.singleSmallThreshold || 500)
          && cycleCount > 1;
        if (singleSmall) perPay = (payIdxInCycle === cycleCount) ? baseAmount : 0;
        else perPay = baseAmount / cycleCount;
      }

      runningBalance += perPay;

      const item = {
        billId: bill.id,
        name: bill.name,
        color: bill.color,
        amount: perPay,
        runningBalance,
        dueDate: D,
        paychecksInCycle: cycleCount
      };
      perPaycheck[i].items.push(item);
      perPaycheck[i].total += perPay;
      byBill[bill.id].push({ payDate: P, ...item });
    }
  }
  if (typeof State !== 'undefined' && State.catShape) {
    const monthlyRateCats = new Set(Object.entries(State.catShape).filter(([_, v]) => v === 'monthly-rate').map(([k]) => k));
    if (monthlyRateCats.size) batchMonthlyRateCats(perPaycheck, bills, monthlyRateCats);
  }
  return { perPaycheck, byBill };
}

  bills: [],

  frequency: 'biweekly',
  theme: 'auto',
  load() {
    try {
      this.bills = JSON.parse(localStorage.getItem(STORE.bills) || '[]');
    } catch { this.bills = []; }

    try { this.catOrder = JSON.parse(localStorage.getItem(STORE.catOrder) || '[]'); }
    catch { this.catOrder = []; }
    try { this.billOrder = JSON.parse(localStorage.getItem(STORE.billOrder) || '[]'); }
    catch { this.billOrder = []; }
    const sc = parseInt(localStorage.getItem(STORE.schedCount) || '6', 10);
    this.schedCount = [6, 12, 18, 26].includes(sc) ? sc : 6;
    this.payAmount = parseFloat(localStorage.getItem(STORE.payAmount) || '0') || 0;
    try { this.collapsedCats = new Set(JSON.parse(localStorage.getItem(STORE.collapsedCats) || '[]')); }
    catch { this.collapsedCats = new Set(); }
    this.showZeroBills = localStorage.getItem(STORE.showZeroBills) === '1';
    this.skipLastOfThree = localStorage.getItem(STORE.skipLastOfThree) === '1';
    this.singleSmallMonthly = localStorage.getItem(STORE.singleSmallMonthly) === '1';
    this.singleSmallThreshold = parseFloat(localStorage.getItem(STORE.singleSmallThreshold) || '500') || 500;
    this.singleSubscription = localStorage.getItem(STORE.singleSubscription) === '1';
    try { this.singlePayCats = new Set((JSON.parse(localStorage.getItem(STORE.singlePayCats) || '[]') || []).map((s) => String(s).toLowerCase())); }
    catch { this.singlePayCats = new Set(); }
    // Migrate legacy singleSubscription flag into the set
    if (this.singleSubscription) this.singlePayCats.add('subscriptions');
    this.subsMonthlyBatch = localStorage.getItem(STORE.subsMonthlyBatch) === '1';
    this.cellCreditEnabled = localStorage.getItem(STORE.cellCreditEnabled) === '1';
    try { this.cellCredits = JSON.parse(localStorage.getItem(STORE.cellCredits) || '{}') || {}; }
    catch { this.cellCredits = {}; }
    const lm = parseInt(localStorage.getItem(STORE.leftoverMonths) || '6', 10);
    this.leftoverMonths = [6, 12].includes(lm) ? lm : 6;
    try { this.batchMonthlyCats = new Set((JSON.parse(localStorage.getItem(STORE.batchMonthlyCats) || '[]') || []).map((s) => String(s).toLowerCase())); }
    catch { this.batchMonthlyCats = new Set(); }
    // Migrate legacy subsMonthlyBatch boolean
    if (this.subsMonthlyBatch) this.batchMonthlyCats.add('subscriptions');
    // Unified per-category payment shape. Values: 'spread' | 'single-cycle' | 'first-two-of-three' | 'monthly-rate'
    try { this.catShape = JSON.parse(localStorage.getItem(STORE.catShape) || '{}') || {}; }
    catch { this.catShape = {}; }
    // One-time migration from legacy singlePayCats + batchMonthlyCats sets
    if (!localStorage.getItem(STORE.catShape)) {
      for (const k of this.singlePayCats) if (!this.catShape[k]) this.catShape[k] = 'single-cycle';
      for (const k of this.batchMonthlyCats) this.catShape[k] = 'monthly-rate'; // batch was the winner
      localStorage.setItem(STORE.catShape, JSON.stringify(this.catShape));
    }
    if (!localStorage.getItem(STORE.seeded)) {
      this.bills = defaultMonthlyBills();
      localStorage.setItem(STORE.seeded, '1');
      this.saveBills();
    }
  },
  saveBills() { localStorage.setItem(STORE.bills, JSON.stringify(this.bills)); },
  setPayStart(v) { this.payStart = v; localStorage.setItem(STORE.payStart, v); },
  setFrequency(v) { this.frequency = v; localStorage.setItem(STORE.freq, v); },
  setTheme(v) { this.theme = v; localStorage.setItem(STORE.theme, v); document.documentElement.setAttribute('data-theme', v); },
  setCatOrder(arr) { this.catOrder = arr; localStorage.setItem(STORE.catOrder, JSON.stringify(arr)); },
  moveCat(name, dir) {
    const cats = this.orderedCategories();
    const i = cats.indexOf(name);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= cats.length) return;
    [cats[i], cats[j]] = [cats[j], cats[i]];
    this.setCatOrder(cats);
  },
  setBillOrder(arr) { this.billOrder = arr; localStorage.setItem(STORE.billOrder, JSON.stringify(arr)); },
  setSchedCount(n) { this.schedCount = n; localStorage.setItem(STORE.schedCount, String(n)); },
  setPayAmount(n) { this.payAmount = n; localStorage.setItem(STORE.payAmount, String(n)); },
  setShowZeroBills(v) { this.showZeroBills = !!v; localStorage.setItem(STORE.showZeroBills, v ? '1' : '0'); },
  setSkipLastOfThree(v) { this.skipLastOfThree = !!v; localStorage.setItem(STORE.skipLastOfThree, v ? '1' : '0'); },
  setSingleSmallMonthly(v) { this.singleSmallMonthly = !!v; localStorage.setItem(STORE.singleSmallMonthly, v ? '1' : '0'); },
  setSingleSmallThreshold(n) { this.singleSmallThreshold = n; localStorage.setItem(STORE.singleSmallThreshold, String(n)); },
  setSingleSubscription(v) { this.singleSubscription = !!v; localStorage.setItem(STORE.singleSubscription, v ? '1' : '0'); this.toggleSinglePayCat('Subscriptions', !!v); },
  setSubsMonthlyBatch(v) { this.subsMonthlyBatch = !!v; localStorage.setItem(STORE.subsMonthlyBatch, v ? '1' : '0'); },
  setCellCreditEnabled(v) { this.cellCreditEnabled = !!v; localStorage.setItem(STORE.cellCreditEnabled, v ? '1' : '0'); },
  setCellCredit(monthKey, amount) {
    const v = Number(amount) || 0;
    if (v > 0) this.cellCredits[monthKey] = v;
    else delete this.cellCredits[monthKey];
    localStorage.setItem(STORE.cellCredits, JSON.stringify(this.cellCredits));
  },
  setLeftoverMonths(n) { this.leftoverMonths = n; localStorage.setItem(STORE.leftoverMonths, String(n)); },
  toggleBatchMonthlyCat(cat, on) {
    const key = cat.toLowerCase();
    if (on) this.batchMonthlyCats.add(key); else this.batchMonthlyCats.delete(key);
    localStorage.setItem(STORE.batchMonthlyCats, JSON.stringify([...this.batchMonthlyCats]));
  },
  isBatchMonthlyCat(cat) { return this.batchMonthlyCats.has((cat || '').toLowerCase()); },
  setCatShape(cat, shape) {
    const key = (cat || '').toLowerCase();
    if (!key) return;
    if (!shape || shape === 'spread') delete this.catShape[key];
    else this.catShape[key] = shape;
    localStorage.setItem(STORE.catShape, JSON.stringify(this.catShape));
    // Keep legacy sets aligned so any code still reading them agrees
    this.singlePayCats.delete(key); if (shape === 'single-cycle') this.singlePayCats.add(key);
    localStorage.setItem(STORE.singlePayCats, JSON.stringify([...this.singlePayCats]));
    this.batchMonthlyCats.delete(key); if (shape === 'monthly-rate') this.batchMonthlyCats.add(key);
    localStorage.setItem(STORE.batchMonthlyCats, JSON.stringify([...this.batchMonthlyCats]));
  },
  getCatShape(cat) { return this.catShape[(cat || '').toLowerCase()] || 'spread'; },
  toggleSinglePayCat(cat, on) {
    const key = cat.toLowerCase();
    if (on) this.singlePayCats.add(key); else this.singlePayCats.delete(key);
    localStorage.setItem(STORE.singlePayCats, JSON.stringify([...this.singlePayCats]));
  },
  isSinglePayCat(cat) { return this.singlePayCats.has((cat || '').toLowerCase()); },
  toggleCatCollapsed(cat) {
    if (this.collapsedCats.has(cat)) this.collapsedCats.delete(cat);
    else this.collapsedCats.add(cat);
    this.persistCollapsed();
  },
  isCatCollapsed(cat) { return this.collapsedCats.has(cat); },
  persistCollapsed() { localStorage.setItem(STORE.collapsedCats, JSON.stringify([...this.collapsedCats])); },
  orderedBillsInCategory(cat) {
    const inCat = this.bills.filter((b) => ((b.category && b.category.trim()) || 'Uncategorized') === cat);
    const idx = (id) => {
      const i = this.billOrder.indexOf(id);
      return i === -1 ? Infinity : i;
    };
    return inCat.slice().sort((a, b) => {
      const ia = idx(a.id), ib = idx(b.id);
      if (ia !== ib) return ia - ib;
      return (a.dueDay || 0) - (b.dueDay || 0);
    });
  },
  moveBill(id, dir) {
    const bill = this.bills.find((b) => b.id === id);
    if (!bill) return;
    const cat = (bill.category && bill.category.trim()) || 'Uncategorized';
    const ordered = this.orderedBillsInCategory(cat);
    const i = ordered.findIndex((b) => b.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= ordered.length) return;
    [ordered[i], ordered[j]] = [ordered[j], ordered[i]];
    // rebuild global billOrder: keep untouched IDs, then this category's new order appended
    const catIds = new Set(ordered.map((b) => b.id));
    const kept = this.billOrder.filter((x) => !catIds.has(x));
    this.setBillOrder([...kept, ...ordered.map((b) => b.id)]);
  },
  deleteCategory(cat) {
    this.bills = this.bills.filter((b) => ((b.category && b.category.trim()) || 'Uncategorized') !== cat);
    this.catOrder = (this.catOrder || []).filter((c) => c !== cat);
    this.collapsedCats.delete(cat);
    this.saveBills();
    localStorage.setItem(STORE.catOrder, JSON.stringify(this.catOrder));
    this.persistCollapsed();
  },
  reorderBillsInCategory(cat, newIdOrder) {
    const inCat = this.bills.filter((b) => ((b.category && b.category.trim()) || 'Uncategorized') === cat);
    const catIds = new Set(inCat.map((b) => b.id));
    // sanitize: keep only IDs actually in this category
    const cleaned = newIdOrder.filter((id) => catIds.has(id));
    // rebuild global billOrder
    const kept = this.billOrder.filter((x) => !catIds.has(x));
    this.setBillOrder([...kept, ...cleaned]);
  },
  orderedCategories() {
    const present = new Set();
    for (const b of this.bills) {
      present.add((b.category && b.category.trim()) || 'Uncategorized');
    }
    const ordered = (this.catOrder || []).filter((c) => present.has(c));
    // Preferred default order for known categories (case-insensitive).
    const preferred = ['Monthly', 'Flexible', 'Non-Monthly', 'Fun Stuff', '3D Printing', 'Subscriptions', 'Maint Home', 'Vehicles'];
    const prefIdx = new Map(preferred.map((p, i) => [p.toLowerCase(), i]));
    const rest = [...present].filter((c) => !ordered.includes(c))
      .sort((a, b) => {
        if (a === 'Uncategorized') return 1;
        if (b === 'Uncategorized') return -1;
        const ai = prefIdx.has(a.toLowerCase()) ? prefIdx.get(a.toLowerCase()) : Infinity;
        const bi = prefIdx.has(b.toLowerCase()) ? prefIdx.get(b.toLowerCase()) : Infinity;
        if (ai !== bi) return ai - bi;
        return a.localeCompare(b);
      });
    return [...ordered, ...rest];
  },
  resetCatOrder() {
    this.catOrder = [];
    localStorage.setItem(STORE.catOrder, '[]');
  },
  upsertBill(bill) {
    const i = this.bills.findIndex((b) => b.id === bill.id);
    if (i >= 0) this.bills[i] = bill; else this.bills.push(bill);
    this.saveBills();
  },
  deleteBill(id) {
    this.bills = this.bills.filter((b) => b.id !== id);
    this.saveBills();
  },
  paySchedule(count = 26) {
    return generatePayDates(parseISO(this.payStart), count, this.frequency);
  }
};

  pushTimer: null,
  listeners: new Set(),

  payloadFromState() {
    return {
      bills: State.bills,
      payStart: State.payStart,
      frequency: State.frequency,
      theme: State.theme,
      catOrder: State.catOrder,
      billOrder: State.billOrder,

    if (p.theme) { State.setTheme(p.theme); }
    if (Array.isArray(p.catOrder)) { State.setCatOrder(p.catOrder); }
    if (Array.isArray(p.billOrder)) { State.setBillOrder(p.billOrder); }
    if (typeof p.schedCount === 'number') { State.setSchedCount(p.schedCount); }
    if (typeof p.payAmount === 'number') { State.setPayAmount(p.payAmount); }
    if (Array.isArray(p.collapsedCats)) { State.collapsedCats = new Set(p.collapsedCats); State.persistCollapsed(); }
    if (typeof p.showZeroBills === 'boolean') { State.setShowZeroBills(p.showZeroBills); }
    if (typeof p.skipLastOfThree === 'boolean') { State.setSkipLastOfThree(p.skipLastOfThree); }
    if (typeof p.singleSmallMonthly === 'boolean') { State.setSingleSmallMonthly(p.singleSmallMonthly); }
    if (typeof p.singleSmallThreshold === 'number') { State.setSingleSmallThreshold(p.singleSmallThreshold); }
    if (typeof p.singleSubscription === 'boolean') { State.setSingleSubscription(p.singleSubscription); }
    if (Array.isArray(p.singlePayCats)) {
      State.singlePayCats = new Set(p.singlePayCats.map((s) => String(s).toLowerCase()));
      localStorage.setItem(STORE.singlePayCats, JSON.stringify([...State.singlePayCats]));

    if (typeof p.cellCreditEnabled === 'boolean') { State.setCellCreditEnabled(p.cellCreditEnabled); }
    if (p.cellCredits && typeof p.cellCredits === 'object') {
      State.cellCredits = { ...p.cellCredits };

    }
    if (typeof p.leftoverMonths === 'number') { State.setLeftoverMonths(p.leftoverMonths); }
    if (Array.isArray(p.batchMonthlyCats)) {
      State.batchMonthlyCats = new Set(p.batchMonthlyCats.map((s) => String(s).toLowerCase()));
      localStorage.setItem(STORE.batchMonthlyCats, JSON.stringify([...State.batchMonthlyCats]));

      State.catShape = { ...p.catShape };

    const { data } = await sb.auth.getSession();

  },
  async signInPassword(email, password) {
    try { await loadSupabaseScript(); } catch (e) { throw new Error('Supabase CDN unreachable: ' + e.message); }
    if (!ensureSb()) throw new Error('Supabase client failed to initialize');
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    return data;
  },
  async signUpPassword(email, password) {
    try { await loadSupabaseScript(); } catch (e) { throw new Error('Supabase CDN unreachable: ' + e.message); }
    if (!ensureSb()) throw new Error('Supabase client failed to initialize');
    const { data, error } = await sb.auth.signUp({ email, password });
    if (error) throw error;
    return data;
  },
  async signOut() { if (ensureSb()) await sb.auth.signOut(); },
  async pullOrPush() {
    if (!ensureSb() || !this.user) return;
    this.setStatus('syncing');
    try {
      const { data, error } = await sb.from('paycheck_data').select('payload,updated_at').maybeSingle();
      if (error) throw error;
      if (data && data.payload && Array.isArray(data.payload.bills) && data.payload.bills.length > 0) {
        this.applyPayload(data.payload);
        this.setStatus('synced');
      } else {
        await this._pushNow();
      }
    } catch (e) { this.setStatus('error', e.message); }
  },
  push() {
    if (!ensureSb() || !this.user) return;
    if (!navigator.onLine) { this.setStatus('offline'); return; }
    clearTimeout(this.pushTimer);
    this.pushTimer = setTimeout(() => this._pushNow(), 800);
  },
  async _pushNow() {
    if (!ensureSb() || !this.user) return;
    this.setStatus('syncing');
    try {
      const { error } = await sb.from('paycheck_data').upsert({
        user_id: this.user.id,
        payload: this.payloadFromState(),
        updated_at: new Date().toISOString()
      });
      if (error) throw error;
      this.setStatus('synced');
    } catch (e) { this.setStatus('error', e.message); }
  }
};

/* ------------------------- Router ------------------------- */
const routes = {};
function route(name, fn) { routes[name] = fn; }

function releaseScrollLock() {
  document.body.classList.remove('drag-lock');
  document.documentElement.style.overflow = '';
}

function navigate() {
  releaseScrollLock();
  const hash = location.hash.replace(/^#/, '') || 'dashboard';
  const [base, ...rest] = hash.split('/');
  const fn = routes[base] || routes.dashboard;
  $$('.nav a, .tabbar a').forEach((a) => a.classList.toggle('active', a.dataset.route === base));
  const main = $('#main');
  main.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'view';
  main.appendChild(view);
  fn(view, rest);
  window.scrollTo({ top: 0 });
}
window.addEventListener('hashchange', navigate);

/* ------------------------- Modal helper ------------------------- */
function openModal(html, opts = {}) {
  const root = $('#modal-root');
  const back = document.createElement('div');
  back.className = 'modal-backdrop' + (opts.fullscreen ? ' modal-backdrop-full' : '');
  back.innerHTML = `<div class="modal${opts.fullscreen ? ' modal-full' : ''}" role="dialog" aria-modal="true">${html}</div>`;
  root.appendChild(back);
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  back.addEventListener('click', (e) => { if (e.target === back) close(); });
  if (opts.onMount) opts.onMount(back, close);
  return { close, root: back };
}
function confirmDialog(message, onYes) {
  const m = openModal(`
    <div class="modal-header"><h3 class="serif">Confirm</h3></div>
    <div class="modal-body"><p>${message}</p></div>
    <div class="modal-footer">
      <button class="btn" data-x="cancel">Cancel</button>
      <button class="btn btn-danger" data-x="ok">Confirm</button>
    </div>
  `, {
    onMount(el, close) {
      el.querySelector('[data-x="cancel"]').onclick = close;
      el.querySelector('[data-x="ok"]').onclick = () => { close(); onYes(); };
    }
  });
  return m;
}

function daysUntil(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.round((d - today) / 86400000);
  if (diff === 0) return 'today';
  if (diff === 1) return 'tomorrow';
  if (diff < 0) return `${-diff} days ago`;
  return `in ${diff} days`;
}

  // Pointer-based drag-and-drop (works on mouse + touch).

  function makeReorderable(items, opts) {
    // opts.groupOf(item) -> group key; items only reorder within same group
    // opts.onDrop(fromItem, toItem, above) -> apply reorder + rerender
    items.forEach((item) => {
      item.addEventListener('pointerdown', (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        const isTouch = e.pointerType === 'touch';

        const start = () => {
          if (cancelled || ghost) return;
          const rect = item.getBoundingClientRect();
          ghost = item.cloneNode(true);
          Object.assign(ghost.style, {
            position: 'fixed', left: rect.left + 'px', top: rect.top + 'px',
            width: rect.width + 'px', pointerEvents: 'none',
            opacity: '0.9', zIndex: '9999', transform: 'scale(1.02)',
            boxShadow: '0 12px 32px rgba(0,0,0,0.45)', margin: '0',
            transition: 'none'
          });
          ghost.classList.add('reorder-ghost');
          document.body.appendChild(ghost);
          item.classList.add('reorder-source');
          if (isTouch && navigator.vibrate) { try { navigator.vibrate(20); } catch {} }
        };

        const lockScroll = () => {
          document.body.classList.add('drag-lock');
          document.documentElement.style.overflow = 'hidden';
        };
        const unlockScroll = () => {
          document.body.classList.remove('drag-lock');
          document.documentElement.style.overflow = '';
        };
        if (isTouch) holdTimer = setTimeout(() => { armed = true; lockScroll(); start(); }, 350);

        const clearIndicators = () => items.forEach((n) => n.classList.remove('drag-over-top', 'drag-over-bottom'));

        const move = (me) => {
          const dx = me.clientX - startX;
          const dy = me.clientY - startY;
          if (!armed) {
            // Cancel long-press if user moves before it fires
            if (Math.hypot(dx, dy) > 8) { clearTimeout(holdTimer); cancelled = true; cleanup(); }
            return;
          }
          if (!ghost && Math.hypot(dx, dy) > 4) { lockScroll(); start(); }
          if (!ghost) return;
          me.preventDefault();
          ghost.style.transform = `translate(${dx}px, ${dy}px) scale(1.02)`;
          ghost.style.display = 'none';
          const el = document.elementFromPoint(me.clientX, me.clientY);
          ghost.style.display = '';
          const target = el ? el.closest(items[0]?.matches ? items[0].tagName + '[' + Object.keys(items[0].dataset).map((k) => 'data-' + k.replace(/[A-Z]/g, (c) => '-' + c.toLowerCase())).join('][') + ']' : '*') : null;
          // simpler: find nearest item in `items` list
          let hit = null;
          if (el) for (const cand of items) { if (cand === el || cand.contains(el)) { hit = cand; break; } }
          clearIndicators();
          if (hit && hit !== item && (!opts.groupOf || opts.groupOf(hit) === opts.groupOf(item))) {
            const trect = hit.getBoundingClientRect();
            const above = (me.clientY - trect.top) < trect.height / 2;
            hit.classList.toggle('drag-over-top', above);
            hit.classList.toggle('drag-over-bottom', !above);
          }
        };

        const up = (ue) => {
          clearTimeout(holdTimer);
          window.removeEventListener('pointermove', move, { passive: false });
          window.removeEventListener('pointerup', up);
          window.removeEventListener('pointercancel', up);
          if (!ghost) {
            // No drag occurred → treat as tap
            const dx = ue.clientX - startX, dy = ue.clientY - startY;
            if (opts.onTap && Math.hypot(dx, dy) < 8) opts.onTap(item, ue);
            cleanup();
            return;
          }
          ghost.style.display = 'none';
          const el = document.elementFromPoint(ue.clientX, ue.clientY);
          let hit = null;
          if (el) for (const cand of items) { if (cand === el || cand.contains(el)) { hit = cand; break; } }
          clearIndicators();
          if (hit && hit !== item && (!opts.groupOf || opts.groupOf(hit) === opts.groupOf(item))) {
            const trect = hit.getBoundingClientRect();
            const above = (ue.clientY - trect.top) < trect.height / 2;
            opts.onDrop(item, hit, above);
          }
          cleanup();
        };

        const cleanup = () => {
          if (ghost) { ghost.remove(); ghost = null; }
          item.classList.remove('reorder-source');
          unlockScroll();
        };

        try { item.setPointerCapture?.(e.pointerId); } catch {}
        window.addEventListener('pointermove', move, { passive: false });
        window.addEventListener('pointerup', up);
        window.addEventListener('pointercancel', up);
      });
    });
  }

  // Categories reorderable + tap to collapse
  makeReorderable($$('[data-cat-drag]'), {
    onDrop: (fromEl, toEl, above) => {
      const fromCat = fromEl.dataset.catDrag;
      const toCat = toEl.dataset.catDrag;
      const order = State.orderedCategories().filter((c) => c !== fromCat);
      const targetIdx = order.indexOf(toCat);
      const insertAt = above ? targetIdx : targetIdx + 1;
      order.splice(insertAt, 0, fromCat);
      State.setCatOrder(order);
      rerenderKeepScroll();
    },
    onTap: (el, ev) => {
      if (ev && ev.target && ev.target.closest('[data-cat-delete]')) return;
      State.toggleCatCollapsed(el.dataset.catToggle);
      rerenderKeepScroll();
    }
  });
  $$('[data-cat-delete]').forEach((btn) => {
    btn.addEventListener('pointerdown', (e) => e.stopPropagation());
    btn.onclick = (e) => {
      e.stopPropagation();
      const cat = btn.dataset.catDelete;
      const count = State.bills.filter((b) => ((b.category && b.category.trim()) || 'Uncategorized') === cat).length;
      confirmDialog(`Delete <strong>${escapeHtml(cat)}</strong> and its ${count} bill${count === 1 ? '' : 's'}?`, () => {
        State.deleteCategory(cat);
        rerenderKeepScroll();
      });
    };
  });

  // Bill rows reorderable within their category
  makeReorderable($$('.bill-row'), {
    groupOf: (row) => row.closest('.cat-group')?.dataset.cat,
    onDrop: (fromEl, toEl, above) => {
      const cat = fromEl.closest('.cat-group')?.dataset.cat;
      const rows = $$(`.cat-group[data-cat="${CSS.escape(cat)}"] .bill-row`);
      const ids = rows.map((r) => r.dataset.id).filter((id) => id !== fromEl.dataset.id);
      const targetIdx = ids.indexOf(toEl.dataset.id);
      const insertAt = above ? targetIdx : targetIdx + 1;
      ids.splice(insertAt, 0, fromEl.dataset.id);
      State.reorderBillsInCategory(cat, ids);
      rerenderKeepScroll();
    }
  });
  $$('[data-del]').forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const id = b.dataset.del;
      const bill = State.bills.find((x) => x.id === id);
      confirmDialog(`Delete <strong>${escapeHtml(bill.name)}</strong>?`, () => {
        State.deleteBill(id);
        navigate();
      });
    };
  });
  attachFab();
});

function openBillEditor(id) {
  const isNew = !id;
  const b = isNew
    ? { id: crypto.randomUUID(), name: '', dueDay: 1, amount: 0, initialSaved: 0, category: localStorage.getItem(STORE.lastCat) || '', color: '#B8860B', recurrence: 'monthly', intervalWeeks: 3, intervalMonths: 6, dueAnchor: toISO(new Date()) }
    : { recurrence: 'monthly', intervalWeeks: 3, intervalMonths: 6, dueAnchor: toISO(new Date()), ...State.bills.find((x) => x.id === id) };

  const m = openModal(`
    <div class="modal-header">
      <h3 class="serif">${isNew ? 'New bill' : 'Edit bill'}</h3>
      <button class="btn btn-ghost" data-x="close" aria-label="Close">✕</button>
    </div>
    <form class="modal-body" id="bill-form">
      <div class="form-grid">
        <div class="full">
          <label>Name</label>
          <input name="name" type="text" required value="${escapeAttr(b.name)}" placeholder="e.g. Rent" />
        </div>
        <div class="full">
          <label>Repeats</label>
          <select name="recurrence">
            <option value="monthly" ${b.recurrence === 'monthly' ? 'selected' : ''}>Monthly (day of month)</option>
            <option value="everyNWeeks" ${b.recurrence === 'everyNWeeks' ? 'selected' : ''}>Every N weeks</option>
            <option value="everyNMonths" ${b.recurrence === 'everyNMonths' ? 'selected' : ''}>Every N months</option>
          </select>
        </div>
        <div class="rec-monthly" ${b.recurrence === 'everyNWeeks' ? 'style="display:none;"' : ''}>
          <label>Due day (1–31)</label>
          <input name="dueDay" type="number" min="1" max="31" value="${b.dueDay || 1}" />
        </div>
        <div class="rec-monthly" ${b.recurrence === 'everyNWeeks' ? 'style="display:none;"' : ''}>
          <label>Amount</label>
          <input name="amount" type="number" min="0" step="0.01" required value="${b.amount}" />
        </div>
        <div class="rec-weekly" ${b.recurrence !== 'everyNWeeks' ? 'style="display:none;"' : ''}>
          <label>First / next due date</label>
          <input name="dueAnchor" type="date" value="${b.dueAnchor || toISO(new Date())}" />
        </div>
        <div class="rec-weekly" ${b.recurrence !== 'everyNWeeks' ? 'style="display:none;"' : ''}>
          <label>Every (weeks)</label>
          <input name="intervalWeeks" type="number" min="1" max="52" value="${b.intervalWeeks || 3}" />
        </div>
        <div class="rec-weekly" ${b.recurrence !== 'everyNWeeks' ? 'style="display:none;"' : ''}>
          <label>Amount (per occurrence)</label>
          <input name="amountWeekly" type="number" min="0" step="0.01" value="${b.amount}" />
        </div>
        <div class="rec-monthN" ${b.recurrence !== 'everyNMonths' ? 'style="display:none;"' : ''}>
          <label>First / next due date</label>
          <input name="dueAnchorM" type="date" value="${b.dueAnchor || toISO(new Date())}" />
        </div>
        <div class="rec-monthN" ${b.recurrence !== 'everyNMonths' ? 'style="display:none;"' : ''}>
          <label>Every (months)</label>
          <input name="intervalMonths" type="number" min="1" max="60" value="${b.intervalMonths || 6}" />
        </div>
        <div class="rec-monthN" ${b.recurrence !== 'everyNMonths' ? 'style="display:none;"' : ''}>
          <label>Amount (per occurrence)</label>
          <input name="amountMonthN" type="number" min="0" step="0.01" value="${b.amount}" />
        </div>
        <div>
          <label>Already saved</label>
          <input name="initialSaved" type="number" min="0" step="0.01" value="${b.initialSaved}" />
        </div>
        <div>
          <label>Category</label>
          <input name="category" type="text" value="${escapeAttr(b.category || '')}" placeholder="Utilities" />
        </div>
        <div class="full" id="preview"></div>
      </div>
    </form>
    <div class="modal-footer">
      ${isNew ? '' : `<button class="btn btn-danger" data-x="del">Delete</button>
                      <button class="btn" data-x="archive">${b.archived ? 'Unarchive' : 'Archive'}</button>`}
      <span class="spacer"></span>
      <button class="btn" data-x="close">Cancel</button>
      <button class="btn btn-primary" data-x="save">Save</button>
    </div>
  `, {
    fullscreen: true,
    onMount(el, close) {
      const form = el.querySelector('#bill-form');
      const preview = el.querySelector('#preview');
      const syncRecurrenceUI = () => {
        const rec = form.recurrence.value;
        el.querySelectorAll('.rec-monthly').forEach((n) => n.style.display = rec === 'monthly' ? '' : 'none');
        el.querySelectorAll('.rec-weekly').forEach((n) => n.style.display = rec === 'everyNWeeks' ? '' : 'none');
        el.querySelectorAll('.rec-monthN').forEach((n) => n.style.display = rec === 'everyNMonths' ? '' : 'none');
      };
      syncRecurrenceUI();
      form.recurrence.addEventListener('change', () => { syncRecurrenceUI(); renderPreview(); });

      const readDraft = () => {
        const fd = new FormData(form);
        const rec = fd.get('recurrence');
        let amount = 0, dueAnchor = b.dueAnchor;
        if (rec === 'everyNWeeks') { amount = parseFloat(fd.get('amountWeekly')) || 0; dueAnchor = fd.get('dueAnchor') || b.dueAnchor; }
        else if (rec === 'everyNMonths') { amount = parseFloat(fd.get('amountMonthN')) || 0; dueAnchor = fd.get('dueAnchorM') || b.dueAnchor; }
        else { amount = parseFloat(fd.get('amount')) || 0; }
        return {
          ...b,
          name: fd.get('name') || '(unnamed)',
          recurrence: rec,
          dueDay: clamp(parseInt(fd.get('dueDay'), 10) || 1, 1, 31),
          dueAnchor,
          intervalWeeks: clamp(parseInt(fd.get('intervalWeeks'), 10) || 1, 1, 52),
          intervalMonths: clamp(parseInt(fd.get('intervalMonths'), 10) || 1, 1, 60),
          amount,
          initialSaved: parseFloat(fd.get('initialSaved')) || 0,
          color: fd.get('color'),
          category: (fd.get('category') || '').toString().trim()
        };
      };
      const renderPreview = () => {
        const draft = readDraft();
        const dates = State.paySchedule(4);
        const { perPaycheck } = computeAllocations([draft], dates);
        preview.innerHTML = `
          <hr class="rule"/>
          <div class="label" style="margin-bottom:6px;">Next 4 paychecks (preview)</div>
          <table class="schedule" style="min-width:0;">
            <thead><tr><th>Pay date</th><th>Allocate</th><th>Running</th></tr></thead>
            <tbody>
              ${perPaycheck.map((p) => {
                const it = p.items[0];
                return `<tr><td>${fmtDateShort.format(p.payDate)}</td><td>${it ? fmtUSD.format(it.amount) : '—'}</td><td>${it ? fmtUSD.format(it.runningBalance) : '—'}</td></tr>`;
              }).join('')}
            </tbody>
          </table>
        `;
      };
      renderPreview();
      form.addEventListener('input', renderPreview);
      el.querySelectorAll('[data-x="close"]').forEach((x) => x.onclick = close);
      el.querySelector('[data-x="save"]').onclick = (e) => {
        e.preventDefault();
        if (!form.reportValidity()) return;
        const draft = readDraft();
        const next = { ...draft, id: b.id, name: draft.name === '(unnamed)' ? '' : draft.name.toString().trim(), color: draft.color || '#B8860B' };
        if (!next.name) { form.name.focus(); return; }
        State.upsertBill(next);
        if (next.category) localStorage.setItem(STORE.lastCat, next.category);
        close();
        navigate();
      };
      const delBtn = el.querySelector('[data-x="del"]');
      if (delBtn) delBtn.onclick = () => {
        confirmDialog(`Delete <strong>${escapeHtml(b.name)}</strong>?`, () => {
          State.deleteBill(b.id);
          close();
          navigate();
        });
      };
      const archBtn = el.querySelector('[data-x="archive"]');
      if (archBtn) archBtn.onclick = () => {
        const existing = State.bills.find((x) => x.id === b.id);
        if (!existing) return;
        existing.archived = !existing.archived;
        State.saveBills();
        close();
        navigate();
      };
    }
  });
}

route('schedule', (root) => {
  const render = () => {
    const count = State.schedCount;
    const payDates = State.paySchedule(count);
    const { perPaycheck } = computeAllocations(State.bills, payDates);
    const activeBills = State.bills.filter((b) => b.amount > 0);
    const billOrder = activeBills.slice().sort((a,b)=>a.dueDay-b.dueDay);
    // group by category, ordered
    const groups = {};
    for (const b of activeBills) {
      const k = (b.category && b.category.trim()) || 'Uncategorized';
      (groups[k] ||= []).push(b);
    }
    const catNames = State.orderedCategories().filter((c) => groups[c]);
    const colCount = perPaycheck.length + 2; // Bill + pay dates + Total

    root.innerHTML = `
      <div class="view-header">
        <div>
          <h1>Pay Schedule</h1>
          <div class="sub">Per-bill allocations across upcoming paychecks. Click a row for running balances.</div>
        </div>
        <button class="btn" id="sched-export">Export CSV</button>
      </div>

      ${
        billOrder.length === 0
        ? `<div class="card empty">${emptySvg()}<h3>No bills to schedule</h3><p>Add bills first to see your schedule.</p></div>`
        : `<div class="schedule-wrap">
            <table class="schedule">
              <thead>
                <tr>
                  <th>Bill</th>
                  ${perPaycheck.map((p) => `<th>${fmtDateShort.format(p.payDate)}</th>`).join('')}
                  <th>Total</th>
                </tr>
              </thead>
              <tbody>
                ${catNames.map((cat) => {
                  const bills = State.orderedBillsInCategory(cat).filter((b) => b.amount > 0);
                  const catRowTotals = perPaycheck.map((p) =>
                    bills.reduce((s, b) => {
                      const it = p.items.find((x) => x.billId === b.id);
                      return s + (it ? it.amount : 0);
                    }, 0)
                  );
                  const catGrandTotal = catRowTotals.reduce((s, v) => s + v, 0);
                  const catHeader = `
                    <tr class="sched-cat-header">
                      <td colspan="${colCount}">
                        <span class="cat-header-inner">
                          <span class="cat-name">${escapeHtml(cat)}</span>
                          <span class="cat-meta">${bills.length} bill${bills.length === 1 ? '' : 's'} · ${fmtUSD.format(catGrandTotal)}</span>
                        </span>
                      </td>
                    </tr>
                  `;
                  const billRows = bills.map((b) => {
                    const idx = billOrder.indexOf(b);
                    // Alternate cell-shading per bill cycle so grouped paychecks are visible.
                    let cycleKey = null; let parity = 0;
                    const cells = perPaycheck.map((p) => {
                      const it = p.items.find((x) => x.billId === b.id);
                      if (!it) { cycleKey = null; return `<td>—</td>`; }
                      const key = it.dueDate.toISOString();
                      const isStart = (key !== cycleKey);
                      if (isStart) { parity ^= 1; cycleKey = key; }
                      return `<td class="cyc-${parity}${isStart ? ' cyc-start' : ''}">${fmtUSD.format(it.amount)}</td>`;
                    }).join('');
                    const detail = perPaycheck.map((p) => {
                      const it = p.items.find((x) => x.billId === b.id);
                      return `<td>${it ? fmtUSD.format(it.runningBalance) : '—'}</td>`;
                    }).join('');
                    const billTotal = perPaycheck.reduce((s, p) => {
                      const it = p.items.find((x) => x.billId === b.id);
                      return s + (it ? it.amount : 0);
                    }, 0);
                    return `
                      <tr class="expandable" data-i="${idx}">
                        <td>${escapeHtml(b.name)}</td>
                        ${cells}
                        <td class="total">${fmtUSD.format(billTotal)}</td>
                      </tr>
                      <tr class="expanded-detail" data-detail-for="${idx}" style="display:none;">
                        <td>Running balance →</td>${detail}<td>—</td>
                      </tr>
                    `;
                  }).join('');
                  const catSubtotal = `
                    <tr class="sched-cat-total">
                      <td>Subtotal</td>
                      ${catRowTotals.map((v) => `<td>${fmtUSD.format(v)}</td>`).join('')}
                      <td class="total">${fmtUSD.format(catGrandTotal)}</td>
                    </tr>
                  `;
                  return catHeader + billRows + catSubtotal;
                }).join('')}
                <tr class="sched-grand-total">
                  <td>Total</td>
                  ${perPaycheck.map((p) => {
                    const over = State.payAmount > 0 && p.total > State.payAmount;
                    return `<td class="total${over ? ' over-pay' : ''}"${over ? ` title="Exceeds $${State.payAmount.toFixed(2)} paycheck"` : ''}>${fmtUSD.format(p.total)}</td>`;
                  }).join('')}
                  <td class="total">${fmtUSD.format(perPaycheck.reduce((s,p)=>s+p.total,0))}</td>
                </tr>
              </tbody>
            </table>
          </div>`
      }
    `;
    $$('tr.expandable').forEach((tr) => tr.onclick = () => {
      const det = root.querySelector(`tr[data-detail-for="${tr.dataset.i}"]`);
      if (det) det.style.display = det.style.display === 'none' ? 'table-row' : 'none';
    });
    const exportBtn = $('#sched-export');
    if (exportBtn) exportBtn.onclick = () => {
      const csvEscape = (v) => {
        const s = String(v ?? '');
        return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
      };
      const money = (n) => n.toFixed(2);
      const rows = [];
      rows.push(['Bill', ...perPaycheck.map((p) => fmtDateShort.format(p.payDate)), 'Total']);
      const grandPerPay = perPaycheck.map(() => 0);
      let grand = 0;
      for (const cat of catNames) {
        const catBills = State.orderedBillsInCategory(cat).filter((b) => b.amount > 0);
        const catPerPay = perPaycheck.map(() => 0);
        let catTotal = 0;
        rows.push([cat]);
        for (const b of catBills) {
          const cells = perPaycheck.map((p) => {
            const it = p.items.find((x) => x.billId === b.id);
            return it ? it.amount : 0;
          });
          const billSum = cells.reduce((s, v) => s + v, 0);
          cells.forEach((v, i) => { catPerPay[i] += v; grandPerPay[i] += v; });
          catTotal += billSum; grand += billSum;
          rows.push([b.name, ...cells.map(money), money(billSum)]);
        }
        rows.push([`  ${cat} subtotal`, ...catPerPay.map(money), money(catTotal)]);
        rows.push([]);
      }
      rows.push(['TOTAL', ...grandPerPay.map(money), money(grand)]);
      const csv = rows.map((r) => r.map(csvEscape).join(',')).join('\r\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `pay-schedule-${toISO(new Date())}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    attachFab(false);
  };
  render();
});
