                <select class="cat-shape" data-cat="${escapeAttr(cat)}" style="width:auto; max-width:220px;">
                  ${shapes.map(([v, l]) => `<option value="${v}" ${State.getCatShape(cat) === v ? 'selected' : ''}>${l}</option>`).join('')}
                </select>
              </div>
            `).join('');
          })()}
        </div>
        <div style="margin-top:14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <input id="single-small" type="checkbox" ${State.singleSmallMonthly ? 'checked' : ''} style="width:auto;" />
          <label for="single-small" style="margin:0; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ink);">"Spread evenly" fallback: monthly bills under</label>
          <input id="single-small-threshold" type="number" min="1" step="1" value="${State.singleSmallThreshold}" style="width:80px;" />
          <label style="margin:0; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ink);">take from last pay only</label>
        </div>
        <div style="margin-top:10px; display:flex; align-items:center; gap:10px;">
          <input id="cell-credit-enable" type="checkbox" ${State.cellCreditEnabled ? 'checked' : ''} style="width:auto;" />
          <label for="cell-credit-enable" style="margin:0; text-transform:none; letter-spacing:0; font-size:13px; color:var(--ink);">Enable inline monthly credit on the Cell bill (Dashboard)</label>
        </div>
      </div>
      <div class="card">
        <h2>Sync (cloud backup)</h2>
        ${
          Sync.user
            ? `<div style="font-size:13px; color:var(--ink); margin-bottom:8px;">Signed in as <strong>${escapeHtml(Sync.user.email || Sync.user.id)}</strong></div>
               <div class="row">
                 <button class="btn" id="sync-now">Sync now</button>
                 <button class="btn btn-danger" id="sync-signout">Sign out</button>
               </div>`
            : `<label>Email</label>
               <input id="sync-email" type="email" autocomplete="email" placeholder="you@example.com" style="margin-bottom:8px;" />
               <label>Password</label>
               <input id="sync-password" type="password" autocomplete="current-password" placeholder="min 6 characters" style="margin-bottom:10px;" />
               <div class="row" style="gap:8px;">
                 <button class="btn btn-primary" id="sync-signin">Sign in</button>
                 <button class="btn" id="sync-signup">Create account</button>
               </div>`
        }
        <div class="hint" style="margin-top:10px; color:var(--ink-muted); font-size:12px;">
          Status: <span id="sync-status">${Sync.status}${Sync.lastError ? ` (${escapeHtml(Sync.lastError)})` : ''}</span>
        </div>
      </div>
      <div class="card">
        <h2>Data</h2>
        <div class="row">
          <button class="btn" id="export">Export JSON</button>
          <label class="btn" for="import-file">Import JSON</label>
          <input id="import-file" type="file" accept="application/json" style="display:none;" />
          <select id="load-template" style="max-width:200px;">
            <option value="">Load template…</option>
            <option value="all">All categories</option>
            <option value="monthly">Monthly</option>
            <option value="flexible">Flexible</option>
            <option value="nonmonthly">Non-Monthly</option>
            <option value="fun">Fun Stuff</option>
            <option value="3d">3D Printing</option>
            <option value="subs">Subscriptions</option>
            <option value="maint">Maint Home</option>
            <option value="vehicles">Vehicles</option>
          </select>
          <button class="btn" id="reset-cat-order">Reset category order</button>
          <button class="btn btn-danger" id="clear-all">Clear all data</button>
        </div>
        <div class="hint" style="margin-top:10px;color:var(--ink-muted);font-size:12px;">Bills are stored in your browser. Use Export regularly as a backup.</div>
      </div>
      <div class="card">
        <h2>About</h2>
        <p style="color:var(--ink-soft);">Paycheck Allocator divides each monthly bill across the paychecks that fall before its due date — a paycheck on the due date can't fund that month, so it allocates to the next cycle.</p>
        <p class="mono" style="font-size:12px;color:var(--ink-muted);">v1 · ledger edition</p>
      </div>
    </div>
    ${testsBlock()}
  `;

  $('#pay-start').onchange = (e) => { State.setPayStart(e.target.value); };
  $('#freq').onchange = (e) => { State.setFrequency(e.target.value); };
  $('#sched-count').onchange = (e) => { State.setSchedCount(parseInt(e.target.value, 10)); };
  $('#leftover-months').onchange = (e) => { State.setLeftoverMonths(parseInt(e.target.value, 10)); };
  $('#pay-amount').onchange = (e) => { State.setPayAmount(parseFloat(e.target.value) || 0); };
  $('#theme').onchange = (e) => { State.setTheme(e.target.value); };
  $('#show-zero').onchange = (e) => { State.setShowZeroBills(e.target.checked); };
  $('#single-small').onchange = (e) => { State.setSingleSmallMonthly(e.target.checked); };
  $('#single-small-threshold').onchange = (e) => { State.setSingleSmallThreshold(parseFloat(e.target.value) || 500); };
  $$('.cat-shape').forEach((el) => {
    el.onchange = () => { State.setCatShape(el.dataset.cat, el.value); };
  });
  const cellCreditEl = $('#cell-credit-enable');
  if (cellCreditEl) cellCreditEl.onchange = (e) => { State.setCellCreditEnabled(e.target.checked); };

  const getCreds = () => ({
    email: ($('#sync-email')?.value || '').trim(),
    password: ($('#sync-password')?.value || '')
  });
  const signinBtn = $('#sync-signin');
  if (signinBtn) signinBtn.onclick = async () => {
    const { email, password } = getCreds();
    if (!email || !password) { alert('Enter your email and password'); return; }
    signinBtn.disabled = true;
    signinBtn.textContent = 'Signing in…';
    try {
      await Sync.signInPassword(email, password);
      // onAuthStateChange will re-render
    } catch (e) {
      alert('Sign-in failed: ' + e.message);
    } finally {
      signinBtn.disabled = false;
      signinBtn.textContent = 'Sign in';
    }
  };
  const signupBtn = $('#sync-signup');
  if (signupBtn) signupBtn.onclick = async () => {
    const { email, password } = getCreds();
    if (!email || password.length < 6) { alert('Enter your email and a password of at least 6 characters'); return; }
    signupBtn.disabled = true;
    signupBtn.textContent = 'Creating…';
    try {
      const { session } = await Sync.signUpPassword(email, password);
      if (!session) {
        alert('Account created. If email confirmation is enabled in Supabase, check ' + email + ' and click the link, then Sign in here.');
      }
      // If session was created (email confirmation off), onAuthStateChange re-renders.
    } catch (e) {
      alert('Sign-up failed: ' + e.message);
    } finally {
      signupBtn.disabled = false;
      signupBtn.textContent = 'Create account';
    }
  };
  const signoutBtn = $('#sync-signout');
  if (signoutBtn) signoutBtn.onclick = async () => {
    await Sync.signOut();
  };
  const syncNowBtn = $('#sync-now');
  if (syncNowBtn) syncNowBtn.onclick = () => Sync._pushNow();

  $('#export').onclick = () => {
    const blob = new Blob([JSON.stringify({ bills: State.bills, payStart: State.payStart, frequency: State.frequency }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `paycheck-allocator-${toISO(new Date())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
  };
  $('#import-file').onchange = (e) => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const bills = Array.isArray(data) ? data : data.bills;
        if (!Array.isArray(bills)) throw new Error('Invalid file');
        confirmDialog(`Import ${bills.length} bills? This replaces your current bills.`, () => {
          State.bills = bills.map((b) => ({ ...b, id: b.id || crypto.randomUUID() }));
          State.saveBills();
          if (data.payStart) State.setPayStart(data.payStart);
          if (data.frequency) State.setFrequency(data.frequency);
          navigate();
        });
      } catch (err) { alert('Import failed: ' + err.message); }
    };
    reader.readAsText(file);
    e.target.value = '';
  };
  const templateFns = {
    monthly:    { label: 'Monthly',     fn: defaultMonthlyBills },
    flexible:   { label: 'Flexible',    fn: defaultFlexibleBills },
    nonmonthly: { label: 'Non-Monthly', fn: defaultNonMonthlyBills },
    fun:        { label: 'Fun Stuff',   fn: defaultFunStuffBills },
    '3d':       { label: '3D Printing', fn: default3DPrintingBills },
    subs:       { label: 'Subscriptions', fn: defaultSubscriptionBills },
    maint:      { label: 'Maint Home',  fn: defaultMaintHomeBills },
    vehicles:   { label: 'Vehicles',    fn: defaultVehiclesBills }
  };
  $('#load-template').onchange = (e) => {
    const key = e.target.value;
    if (!key) return;
    let bills, label;
    if (key === 'all') {
      bills = Object.values(templateFns).flatMap((t) => t.fn());
      label = 'all categories';
    } else if (templateFns[key]) {
      bills = templateFns[key].fn();
      label = templateFns[key].label;
    } else {
      e.target.value = ''; return;
    }
    confirmDialog(`Add ${bills.length} default ${label} bills to your list? Existing bills stay put.`, () => {
      State.bills = [...State.bills, ...bills];
      State.saveBills();
      navigate();
    });
    e.target.value = '';
  };
  $('#reset-cat-order').onclick = () => {
    State.resetCatOrder();
    navigate();
  };
  $('#clear-all').onclick = () => {
    confirmDialog('Permanently delete all bills and reset settings?', () => {
      Object.values(STORE).forEach((k) => localStorage.removeItem(k));
      State.load();
      navigate();
    });
  };
  attachFab(false);
  wireTests(root);
});

/* ------------------------- FAB / utilities ------------------------- */
function attachFab(show = true) {
  let fab = document.getElementById('fab');
  if (!show) { if (fab) fab.remove(); return; }
  if (!fab) {
    fab = document.createElement('button');
    fab.id = 'fab'; fab.className = 'fab'; fab.setAttribute('aria-label', 'Add bill');
    fab.textContent = '+';
    document.body.appendChild(fab);
  }
  fab.onclick = () => openBillEditor(null);
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function escapeHtml(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return escapeHtml(s); }
function emptySvg() {
  return `<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="10" y="8" width="44" height="48" rx="4"/><line x1="18" y1="20" x2="46" y2="20"/><line x1="18" y1="28" x2="46" y2="28"/><line x1="18" y1="36" x2="38" y2="36"/><circle cx="46" cy="46" r="6"/><line x1="46" y1="42" x2="46" y2="50"/><line x1="42" y1="46" x2="50" y2="46"/></svg>`;
}

/* ------------------------- Test harness ------------------------- */
function testsBlock() {
  return `<details class="tests"><summary>▸ Run tests</summary>
    <div style="margin-top:12px;">
      <button class="btn btn-primary" id="run-tests">Run</button>
      <pre id="test-out" style="margin-top:12px;display:none;"></pre>
    </div>
  </details>`;
}
function wireTests(root) {
  const btn = root.querySelector('#run-tests');
  if (!btn) return;
  btn.onclick = () => {
    const out = root.querySelector('#test-out');
    out.style.display = 'block';
    out.innerHTML = '';
    const log = (line, ok) => {
      const span = document.createElement('div');
      span.className = ok === true ? 'pass' : ok === false ? 'fail' : '';
      span.textContent = (ok === true ? '✓ ' : ok === false ? '✗ ' : '  ') + line;
      out.appendChild(span);
    };
    runTests(log);
  };
}

function runTests(log) {
  let pass = 0, fail = 0;
  const t = (name, fn) => {
    try { fn(); pass++; log(name, true); }
    catch (e) { fail++; log(name + ' — ' + e.message, false); }
  };
  const eq = (a, b, msg) => {
    const aa = typeof a === 'number' ? Math.round(a * 100) / 100 : a;
    const bb = typeof b === 'number' ? Math.round(b * 100) / 100 : b;
    if (aa !== bb) throw new Error((msg || 'eq') + ` — got ${a}, expected ${b}`);
  };

  log('— Allocation engine tests —');

  t('biweekly: 2 paychecks before due → bill / 2', () => {
    // pay start May 1 2026, due day 20. Pay dates: May 1, 15, 29, ...
    // First D after May 1 = May 20. Pay dates strictly between Apr 20 and May 20: May 1, May 15 → 2.
    const bills = [{ id: '1', name: 'X', dueDay: 20, amount: 100, initialSaved: 0 }];
    const dates = generatePayDates(parseISO('2026-05-01'), 6, 'biweekly');
    const { perPaycheck } = computeAllocations(bills, dates);
    eq(perPaycheck[0].items[0].amount, 50, 'May 1 alloc');
    eq(perPaycheck[1].items[0].amount, 50, 'May 15 alloc');
  });

  t('paycheck on due date allocates to next cycle, not current', () => {
    // Pay start May 1, due day 1. May 1 paycheck should allocate toward June 1.
    const bills = [{ id: '1', name: 'Rent', dueDay: 1, amount: 300, initialSaved: 0 }];
    const dates = generatePayDates(parseISO('2026-05-01'), 4, 'biweekly');
    const { perPaycheck } = computeAllocations(bills, dates);
    // D for May 1 paycheck must be June 1 (not May 1)
    const it = perPaycheck[0].items[0];
    eq(it.dueDate.getMonth(), 5, 'D is June (month idx 5)');
    eq(it.dueDate.getDate(), 1, 'D day is 1');
  });

  t('initialSaved subtracts only from first cycle', () => {
    // amount 100, initialSaved 40, 2 paychecks per cycle → first cycle 30/30, later cycles 50/50
    const bills = [{ id: '1', name: 'X', dueDay: 20, amount: 100, initialSaved: 40 }];
    const dates = generatePayDates(parseISO('2026-05-01'), 8, 'biweekly');
    const { perPaycheck } = computeAllocations(bills, dates);
    eq(perPaycheck[0].items[0].amount, 30, 'first cycle pay 1');
    eq(perPaycheck[1].items[0].amount, 30, 'first cycle pay 2');
    // After May 20 due passes, next cycle starts. May 29 pay funds June 20.
    // Pay dates between May 20 and June 20: May 29, June 12 → 2 → 50 each.
    eq(perPaycheck[2].items[0].amount, 50, 'second cycle pay 1');
    eq(perPaycheck[3].items[0].amount, 50, 'second cycle pay 2');
  });

  t('clamps due day 31 in February', () => {
    const bills = [{ id: '1', name: 'X', dueDay: 31, amount: 100, initialSaved: 0 }];
    const dates = generatePayDates(parseISO('2027-02-01'), 2, 'biweekly');
    const { perPaycheck } = computeAllocations(bills, dates);
    const it = perPaycheck[0].items[0];
    // Feb 2027 has 28 days
    eq(it.dueDate.getMonth(), 1, 'February month idx');
    eq(it.dueDate.getDate(), 28, 'clamped to last day of Feb');
  });

  t('skips bills with zero or negative amount', () => {
    const bills = [
      { id: '1', name: 'Zero', dueDay: 15, amount: 0, initialSaved: 0 },
      { id: '2', name: 'Neg',  dueDay: 15, amount: -50, initialSaved: 0 },
      { id: '3', name: 'Real', dueDay: 15, amount: 100, initialSaved: 0 }
    ];
    const dates = generatePayDates(parseISO('2026-05-01'), 4, 'biweekly');
    const { perPaycheck } = computeAllocations(bills, dates);
    eq(perPaycheck[0].items.length, 1, 'only real bill');
    eq(perPaycheck[0].items[0].name, 'Real');
  });

  t('running balance accumulates and resets after due passes', () => {
    const bills = [{ id: '1', name: 'X', dueDay: 20, amount: 100, initialSaved: 0 }];
    const dates = generatePayDates(parseISO('2026-05-01'), 6, 'biweekly');
    const { perPaycheck } = computeAllocations(bills, dates);
    // May 1: bal 50, May 15: bal 100. May 20 passes → reset.
    eq(perPaycheck[0].items[0].runningBalance, 50, 'after May 1');
    eq(perPaycheck[1].items[0].runningBalance, 100, 'after May 15');
    eq(perPaycheck[2].items[0].runningBalance, 50, 'first pay of new cycle resets and adds');
  });

  t('initialSaved reflected in starting running balance contribution', () => {
    const bills = [{ id: '1', name: 'X', dueDay: 20, amount: 100, initialSaved: 40 }];
    const dates = generatePayDates(parseISO('2026-05-01'), 2, 'biweekly');
    const { perPaycheck } = computeAllocations(bills, dates);
    // Already saved 40, then add 30 = 70 after first pay; 100 after second.
    eq(perPaycheck[0].items[0].runningBalance, 70, 'first pay running');
    eq(perPaycheck[1].items[0].runningBalance, 100, 'second pay running');
  });

  t('mid-cycle bill recalculates from current pay date forward', () => {
    // We simulate "added mid-cycle" by starting pay dates partway through a month.
    const bills = [{ id: '1', name: 'X', dueDay: 20, amount: 100, initialSaved: 0 }];
    const dates = generatePayDates(parseISO('2026-05-15'), 4, 'biweekly');
    const { perPaycheck } = computeAllocations(bills, dates);
    // Only May 15 pay date is strictly before May 20 due, so cycle count = 1, full $100.
    eq(perPaycheck[0].items[0].amount, 100, 'one-pay cycle');
  });

  log('');
  log(`Result: ${pass} passed, ${fail} failed`, fail === 0);
}

/* ------------------------- Boot ------------------------- */
// Belt-and-suspenders: clear any stuck drag lock from a previous session.
document.body.classList.remove('drag-lock');
document.documentElement.style.overflow = '';
window.addEventListener('pointerup', () => setTimeout(() => {
  // If drag-lock somehow stuck (interrupted drag), clear it on next frame after any drop handler runs.
  if (!document.querySelector('.reorder-ghost')) {
    document.body.classList.remove('drag-lock');
    document.documentElement.style.overflow = '';
  }
}, 50));

State.load();

// Wire State mutations to trigger Supabase push (debounced inside Sync.push).
['saveBills','setCatOrder','setBillOrder','setSchedCount','setPayAmount','setPayStart','setFrequency','setTheme','setShowZeroBills','setSkipLastOfThree','setSingleSmallMonthly','setSingleSmallThreshold','setSingleSubscription','toggleSinglePayCat','setSubsMonthlyBatch','toggleBatchMonthlyCat','setCatShape','setCellCreditEnabled','setCellCredit','setLeftoverMonths','persistCollapsed'].forEach((k) => {
  if (typeof State[k] !== 'function') return;
  const orig = State[k].bind(State);
  State[k] = (...args) => { const r = orig(...args); try { Sync.push(); } catch {} return r; };
});
Sync.on(() => { const el = document.getElementById('sync-status'); if (el) el.textContent = Sync.status + (Sync.lastError ? ` (${Sync.lastError})` : ''); });
Sync.init();

navigate();

/* PWA service worker (only over http(s)) */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
